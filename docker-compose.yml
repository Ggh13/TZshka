services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: forumuser
      POSTGRES_PASSWORD: qwerty1234
      POSTGRES_DB: forumdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forumuser -d forumdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  llm_api:
    build:
      context: ./llm_api
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8001"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

  app:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      llm_api:
        condition: service_started
    environment:
      PORT: 8080
      REST_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      LLM_API_URL: http://llm_api:8001
    volumes:
      - ./backend/config:/app/config

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules: